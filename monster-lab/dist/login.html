<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080908">
  <meta name="referrer" content="no-referrer">
  <title>登入 — Moster Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23080908%27 stroke=%27%239c9f99%27/%3E%3Ctext x=%2716%27 y=%2721%27 text-anchor=%27middle%27 font-size=%2714%27 fill=%27%23f1f1ec%27 font-family=%27Arial%27%3EM%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing.css?v=launch-8">
  <link rel="stylesheet" href="/pricing.css?v=3">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Moster Lab home"><span class="mark">M</span><span>MOSTER <span class="wordmark-light">LAB</span></span></a>
    <nav aria-label="Main navigation"><a href="/pricing">方案</a><a class="nav-cta" href="/app/">ENTER THE LAB <span>↗</span></a></nav>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
  </header>
  <main class="pricing narrow">
    <div class="micro-label"><span>SIGN IN</span><span>EMAIL</span></div>
    <h1>用 Email 登入。<br><span>不用記密碼。</span></h1>
    <p class="lead" id="loginLead">輸入 Email，我們會寄一個一次性登入連結給你。</p>
    <form id="loginForm" class="redeem" autocomplete="on">
      <label for="loginEmail">Email</label>
      <div class="row"><input id="loginEmail" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">寄登入連結</button></div>
      <small id="loginNote" role="status"></small>
    </form>
    <p class="fine">登入連結 15 分鐘內有效、只能使用一次。按下連結後會在這個瀏覽器保持登入 30 天。</p>
  </main>
  <script type="module" src="/login.js?v=1"></script>
  <script src="/landing.js?v=launch-3" defer></script>
</body>
</html>
